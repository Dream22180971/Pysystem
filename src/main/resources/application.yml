server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pysystem
  autoconfigure:
    exclude:
      # JWT 登录不需要默认的内存用户；避免控制台打印随机密码与多余 AuthenticationManager
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pharmacy_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  config-location: classpath:mybatis-config.xml
  mapper-locations: classpath:mapper/*.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
  security:
    jwt:
      # Replace in production (env var APP_JWT_SECRET). Must be at least 32 chars for HS256.
      secret: ${APP_JWT_SECRET:change-me-change-me-change-me-change-me}
      ttl-seconds: ${APP_JWT_TTL_SECONDS:86400}
